[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zarr-imaging-daos"
version = "0.1.0"
description = "Radio Astronomy (FITS/WCS) and MRI (NIfTI/OME-Zarr) pipelines for Zarr on DAOS"
requires-python = ">=3.11"
dependencies = [
    "zarr-daos>=0.1.0",
    "zarr>=3.4.0",
    "numpy>=1.26.0",
    "xarray>=2024.10.0",
    "dask[array]>=2024.8.0",
    "astropy>=6.0.0",
    "nibabel>=5.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
